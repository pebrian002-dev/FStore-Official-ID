<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baca Catatan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tombol Fullscreen -->
    <button id="fsToggle" class="fullscreen-btn" title="Layar Penuh">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
    </button>

    <div class="container">
        <!-- Bagian Password -->
        <div id="passwordSection" class="hidden" style="margin-top: 50px;">
            <div class="header" style="text-align: center;">
                <h1 style="font-size: 3rem; margin-bottom: 15px;">🔒</h1>
                <h1>Catatan Terkunci</h1>
            </div>
            <div class="form-group">
                <input type="password" id="viewPassword" placeholder="Masukkan password...">
            </div>
            <button id="unlockBtn" class="primary-btn">Buka Catatan</button>
            <p id="errorMsg" class="error-text"></p>
        </div>

        <!-- Bagian Isi Catatan -->
        <div id="noteSection" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
            <h1 id="noteTitle" class="note-title">Memuat...</h1>
            <div id="noteContent" class="note-content"></div>
            
            <a href="index.html" class="back-link">← Buat Catatan Baru</a>
        </div>
    </div>

    <!-- Script Fullscreen -->
    <script>
        const fsBtn = document.getElementById('fsToggle');
        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        });
    </script>
    <script type="module" src="view.js"></script>
</body>
</html>
